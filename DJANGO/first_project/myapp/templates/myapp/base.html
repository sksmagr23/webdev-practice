{% load static %}
<!DOCTYPE html>
<html>
    <head>
    <link rel="stylesheet" type="text/css" href="{% static 'myapp/main.css' %}">    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    {% if title %}
        <title>Django App - {{ title }}</title>
    {% else %}
        <title>Django App</title>
    {% endif %}
    <script rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </head>
    <body>
        <div>
          {% if messages %}
            {% for message in messages %}
              <div>
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
          {% block content %}{% endblock %}
        </div>  
    </body>
</html>
