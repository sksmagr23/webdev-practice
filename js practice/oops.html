<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOPS in JS</title>
  </head>
  <body>
    <script>
      /* let animal = {
      eats: true,
    };

    let rabbit = {
      jumps: true,
    };
    rabbit.__proto__ = animal; */ // sets rabbit.[[Prototype]] = animal

      class Animal {
        constructor(name) {
          this.name = name;
          console.log("Object is created...");
        }
        eats() {
          console.log("Khata hai");
        }
        jumps() {
          console.log("Koodta hai");
        }
      }
      let a = new Animal("RABBIT");
      console.log(a);

      class Lion extends Animal {
        constructor(name) {
          super(name);
          console.log("Object is created and he is a lion...");
        }

        eats() {
          super.eats();
          console.log("Kha raha hoon roar");
        }
      }
      let l = new Lion("Shera");
      console.log(l);

      class User {
        constructor(name) {
          // invokes the setter
          this.name = name;
        }

        get name() {
          return this._name;
        }

        set name(value) {
          if (value.length < 4) {
            console.log("Name is too short.");
            return;
          }
          this._name = value;
        }
      }

      let user = new User("John");
      console.log(user.name); // John

      user.name = "Harry"; // Name is too short.
      console.log(user.name);
    </script>
  </body>
</html>
