<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Json Tutorial</title>
  </head>
  <body>
    <script>
      let jsonObj = {
        name: "Saksham",
        college: "IIT Varanasi",
        Branch: "Chemical",
        City: "Varanasi", 
        Hobby: "Coding",
      };
      console.log(jsonObj);
      let myJsonStr = JSON.stringify(jsonObj);
      console.log(myJsonStr);

      myJsonStr = myJsonStr.replace("Chemical", "CSE");
      console.log(myJsonStr);

      newJsonObj = JSON.parse(myJsonStr);
      console.log(newJsonObj);
    </script>
  </body>
</html>
