<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local storage</title>
</head>
<body>
    <script>
        a = prompt("Enter your name")
        localStorage.setItem("myname", a)
        document.write("Welcome "+ a)
    
        const sak = localStorage.getItem("myname")
        console.log(sak)
    </script>

</body>
</html>
